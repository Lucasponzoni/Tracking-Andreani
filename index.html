<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVOGAR | Seguimiento de Envíos Ecommerce</title>
    <link rel="shortcut icon" href="./img/Location.webp" type="image/x-icon">

    <!-- Bootstrap Icons (solo iconos) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <!-- Tipografía -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Tailwind Play CDN v3 (colores rgb → compatibles con html2canvas/PDF) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Tema antes del primer paint (evita FOUC) -->
    <script>
        (function () {
            try {
                // Tema oscuro por defecto; claro solo si el usuario lo eligió.
                if (localStorage.getItem('theme') !== 'light') {
                    document.documentElement.classList.add('dark');
                }
            } catch (e) {
                document.documentElement.classList.add('dark');
            }
        })();

        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { DEFAULT: '#4f46e5', light: '#6366f1', dark: '#3730a3' },
                        accent: '#06b6d4',
                        ok: '#10b981',
                    },
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
                    },
                },
            },
        };
    </script>

    <!-- Generación de PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.2/html2pdf.bundle.min.js"></script>
</head>

<body class="font-sans min-h-screen flex flex-col antialiased text-slate-900 dark:text-slate-100
             bg-slate-50 dark:bg-slate-950 transition-colors duration-300">

    <!-- Topbar -->
    <header class="sticky top-0 z-40 border-b border-slate-200/70 dark:border-slate-800/70
                   bg-white/70 dark:bg-slate-900/70 backdrop-blur-md">
        <div class="mx-auto flex h-16 w-full max-w-3xl items-center justify-between px-4">
            <img src="./img/Logo Tracking.png" alt="Tracking Novogar" class="h-8 w-auto">
            <button id="theme-toggle" type="button" aria-label="Cambiar tema"
                class="inline-flex h-10 w-10 items-center justify-center rounded-full border
                       border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800
                       text-brand dark:text-accent text-lg shadow-sm hover:scale-110 active:scale-95 transition">
                <i class="bi bi-moon-stars-fill block dark:hidden"></i>
                <i class="bi bi-sun-fill hidden dark:block"></i>
            </button>
        </div>
    </header>

    <main class="relative flex-1 w-full">
        <!-- Halo decorativo del hero -->
        <div class="pointer-events-none absolute inset-x-0 top-0 -z-0 h-72
                    bg-gradient-to-b from-indigo-200/60 via-cyan-100/30 to-transparent
                    dark:from-indigo-900/40 dark:via-slate-900/0 dark:to-transparent"></div>

        <div class="relative z-10 mx-auto w-full max-w-3xl px-4 pb-20">

            <!-- Hero + buscador -->
            <section class="pt-12 pb-6 text-center">
                <h1 class="text-3xl font-extrabold tracking-tight sm:text-4xl">Seguí tu envío</h1>
                <p class="mx-auto mt-2 max-w-md text-slate-500 dark:text-slate-400">
                    Ingresá tu número de seguimiento de Andreani y mirá el estado en tiempo real.
                </p>

                <div class="mx-auto mt-6 max-w-xl">
                    <div class="flex gap-2 rounded-2xl bg-white/80 dark:bg-slate-800/80 backdrop-blur
                                p-2 shadow-xl ring-1 ring-slate-200/70 dark:ring-slate-700/70">
                        <div class="flex flex-1 items-center gap-2 pl-3">
                            <i class="bi bi-upc-scan text-lg text-slate-400"></i>
                            <input id="tracking-input" type="number" inputmode="numeric"
                                class="w-full bg-transparent py-3 text-base text-slate-900 dark:text-slate-100
                                       placeholder:text-slate-400 focus:outline-none"
                                placeholder="Ej: 360000123456789">
                        </div>
                        <button id="search-btn" type="button"
                            class="inline-flex shrink-0 items-center gap-2 rounded-xl bg-brand px-5 py-3
                                   font-semibold text-white shadow-lg shadow-brand/25
                                   hover:bg-brand-dark active:scale-95 transition-colors duration-300">
                            <i class="bi bi-search"></i><span class="hidden sm:inline">Buscar</span>
                        </button>
                    </div>
                </div>
            </section>

            <!-- Resultado -->
            <section id="result" class="hidden space-y-5">
                <!-- Spinner -->
                <div id="spinner" class="hidden flex-col items-center justify-center gap-4 py-20">
                    <span class="h-12 w-12 animate-spin rounded-full border-4
                                 border-slate-200 dark:border-slate-700 border-t-brand dark:border-t-accent"></span>
                    <p class="text-sm font-medium text-slate-500 dark:text-slate-400">Localizando envío…</p>
                </div>

                <div id="status-hero"></div>
                <div id="stepper"></div>

                <div id="actions" class="flex flex-col items-stretch gap-3 sm:flex-row sm:flex-wrap sm:justify-center">
                    <div id="constancia" class="flex flex-1 items-center justify-center text-center"></div>
                    <div id="pdf-btn-container" class="flex items-center justify-center"></div>
                </div>

                <div id="timeline"></div>
                <div id="brand-block"></div>

                <div id="error-box" class="hidden"></div>
            </section>
        </div>
    </main>

    <footer class="mt-auto flex flex-col items-center gap-1 border-t border-slate-200 dark:border-slate-800
                   bg-white dark:bg-slate-900 p-6 text-center">
        <img class="w-24" src="./img/Novogar N.png" alt="Logo Novogar">
        <a class="text-lg font-bold text-slate-700 dark:text-slate-200 hover:text-brand transition-colors" href="https://novogar.com.ar/" target="_blank">NOVOGAR</a>
        <div class="mt-1 flex flex-wrap items-center justify-center gap-x-4 gap-y-1 text-sm">
            <a class="text-slate-500 dark:text-slate-400 hover:text-brand hover:underline transition-colors" href="https://novogar.com.ar/info/empresa" target="_blank">Quienes somos</a>
            <a class="text-slate-500 dark:text-slate-400 hover:text-brand hover:underline transition-colors" href="https://novogar.com.ar/info/Sucursales" target="_blank">Sucursales</a>
            <a class="text-slate-500 dark:text-slate-400 hover:text-brand hover:underline transition-colors" href="https://novogar.com.ar/info/ventaTelefonica" target="_blank">Atención al cliente</a>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
